[project]
name = "pymagnet"
version = "0.5.0"
description = "User Friendly Magnetic Field Calculations"
authors = [
    { name = "Peter Dunne", email = "peter.dunne@applied-magnetism.com" },
]
readme = "README.md"
keywords = ["magnetism", "magnetic fields"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0.1", "numpy-stl>=3.1.2", "numba>=0.60.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.9.2", "plotly>=5.23.0"]
jupyter = ["ipykernel>=6.29.5", "nbformat>=5.10.4"]
dev = ["ruff>=0.8.0", "pytest>=8.0.0", "pytest-cov>=4.1.0"]
all = ["pymagnet[plots,jupyter,dev]"]

[project.urls]
Homepage = "https://www.applied-magnetism.com"
Repository = "https://github.com/pdunne/pymagnet"
Documentation = "https://pdunne.github.io/pymagnet/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymagnet"]

# UV configuration
[tool.uv]
dev-dependencies = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.2",
    "plotly>=5.23.0",
    "nbformat>=5.10.4",
]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules
    "PERF", # performance anti-patterns
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["pymagnet"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "numba: tests involving Numba JIT compilation",
    "integration: integration tests combining multiple components",
    "numerical: numerical accuracy and edge case tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/pymagnet"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
