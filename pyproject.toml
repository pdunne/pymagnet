[project]
name = "pymagnet"
version = "0.5.0"
description = "User Friendly Magnetic Field Calculations"
authors = [
    { name = "Peter Dunne", email = "peter.dunne@applied-magnetism.com" },
]
readme = "README.md"
keywords = ["magnetism", "magnetic fields"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
#dependencies = ["numpy>=1.22,<2.0", "numpy-stl>=2.16,<3.0", "numba>=0.55,<0.56"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.1",
    "numpy-stl>=3.1.2",
    "numba>=0.60.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9.2", "plotly>=5.23.0"]
jupyter = ["ipykernel>=6.29.5", "nbformat>=5.10.4"]


[project.urls]
Homepage = "https://www.applied-magnetism.com"
Repository = "https://github.com/pdunne/pymagnet"
Documentation = "https://pdunne.github.io/pymagnet/"

[tool]

[tool.ruff.lint]
# select = ["ALL"]
select = ["E", "F", "B", "I", "W"]


[tool.rye]
managed = true
dev-dependencies = [
    "ruff>=0.5.6",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.2",
    "plotly>=5.23.0",
    "nbformat>=5.10.4",
]

[tool.extras]
plots = ["matplotlib", "plotly"]
jupyter = ["ipykernel", "nbformat"]


[tool.hatch]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pymagnet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
