[grid]
type = "slice"
plane = "xy"
max1 = 60.0
max2 = 60.0
slice_value = 0.0
num_points = 200
unit = "mm"

[plot]
enabled = true
type = "slice"
cmap = "viridis"
cmin = 0.0
cmax = 1.5
planes = ["xy", "xz", "yz"]
show_magnets = true
opacity = 0.7
num_arrows = 15
