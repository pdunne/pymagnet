theta = 90.0
phi = 0.0
mask_magnet = true

# Prism 8: center = (-30, 0, -30), Jr = +1.26, phi = 90
[[magnets]]
type = "Prism"
Jr = 1.26
width = 30.0
depth = 60.0
height = 30.0
center = [-30.0, 0.0, -30.0]
theta = 90.0
phi = 0.0
